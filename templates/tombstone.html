{% extends "base.html" %}
{% block content %}

<div style="max-width:520px; margin-top:40px;">
    <h2>content removed</h2>
    <p class="meta">item <code>{{ item_id }}</code> is no longer available.</p>

    <div class="alert alert-danger" style="margin: 20px 0;">
        <strong>reason:</strong><br>
        {{ reason }}
    </div>

    <p style="font-size:0.83rem; color:var(--text-3);">
        this link is quarantined until
        <script>document.write(new Date({{ expires_at }} * 1000).toLocaleDateString())</script>.
        in accordance with our <a href="/tos">terms of service</a>.
    </p>

    <div class="btn-row" style="margin-top:24px;">
        <a href="/"><button type="button">← back to home</button></a>
    </div>
</div>

{% endblock %}
